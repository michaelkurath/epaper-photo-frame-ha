configuration:
  album_url:
    name: Geteiltes Google-Photos-Album
    description: Öffentlicher Freigabelink; es wird kein Google-Login verwendet.
  api_token:
    name: Geräte-API-Token
    description: Mindestens 16 zufällige Zeichen für den ePaper-Controller.
  album_poll_hours:
    name: Album-Prüfintervall
    description: Stunden zwischen Prüfungen auf neue Fotos.
  frame_interval_hours:
    name: Bildwechsel-Intervall
    description: Empfohlenes Deep-Sleep-Intervall des Display-Controllers.
  fit_mode:
    name: Bildanpassung
    description: Füllend zuschneiden oder vollständig mit Rand einpassen.
  display_model:
    name: Displaymodell und Controllerboard
    description: 13,3 Zoll benötigt EE02; 7,3 Zoll mit 800 x 480 Pixeln benötigt EE04. Nach einer Änderung die App neu starten.
  orientation:
    name: Display-Ausrichtung
    description: Dreht die für das gewählte Displayprofil erzeugten Bilder ins Hoch- oder Querformat.
  smart_unused_percent:
    name: Erlaubte freie Displayfläche
    description: Prozentwert, der bei intelligentem Ausschnitt als Rand frei bleiben darf.
  dither:
    name: Dithering
    description: Aktiviert Fehlerdiffusion für weichere Farbverläufe.
  dither_strength:
    name: Dithering-Stärke
    description: 50 Prozent wird für Fotos empfohlen; 100 Prozent entspricht vollständigem Floyd-Steinberg-Dithering.
  night_start:
    name: Nachtpause beginnt
    description: Lokale Uhrzeit, ab der das letzte Bild stehen bleibt.
  night_end:
    name: Nachtpause endet
    description: Lokale Uhrzeit, ab der Bilder wieder gewechselt werden dürfen.
network:
  8080/tcp: Token-geschützte API für den ePaper-Controller

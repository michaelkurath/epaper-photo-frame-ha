configuration:
  album_url:
    name: Shared Google Photos album URL
    description: Public share URL; no Google login is used.
  api_token:
    name: Device API token
    description: At least 16 random characters used by the ePaper controller.
  album_poll_hours:
    name: Album refresh interval
    description: Hours between checks for new album photos.
  frame_interval_hours:
    name: Frame interval
    description: Recommended deep-sleep interval for the display controller.
  fit_mode:
    name: Photo fit
    description: Crop to fill or contain the full photo with a border.
  display_model:
    name: Display model and controller board
    description: The 13.3-inch panel requires EE02; the 800 by 480 7.3-inch panel requires EE04. Restart the App after changing it.
  orientation:
    name: Display orientation
    description: Rotate frames for the selected display profile to portrait or landscape.
  smart_unused_percent:
    name: Allowed unused display area
    description: Percentage that Smart Crop may leave empty as a border.
  dither:
    name: Dithering
    description: Enable error diffusion for smoother colour transitions.
  dither_strength:
    name: Dithering strength
    description: 50 percent is recommended for photos; 100 percent is full Floyd-Steinberg dithering.
  night_start:
    name: Night pause starts
    description: Local time after which the controller should keep the last image.
  night_end:
    name: Night pause ends
    description: Local time at which normal image changes may resume.
network:
  8080/tcp: Token-protected API for the ePaper controller

name: "ePaper Photo Frame"
version: "0.5.0"
slug: "epaper_photo_frame"
description: >-
  Google Photos album, Spectra 6 image processing, and a local device API for
  a DIY ePaper photo frame.
url: "https://github.com/michaelkurath/epaper-photo-frame-ha"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: "mdi:image-frame"
watchdog: "http://[HOST]:[PORT:8099]/health"
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: "Token-protected API for the ePaper controller"
options:
  album_url: null
  api_token: null
  album_poll_hours: 6
  frame_interval_hours: 4
  fit_mode: "smart"
  display_model: "spectra_13_3_ee02"
  orientation: "portrait"
  smart_unused_percent: 15
  dither: true
  dither_strength: 50
  night_start: "23:00"
  night_end: "07:00"
schema:
  album_url: url
  api_token: password
  album_poll_hours: "int(1,168)"
  frame_interval_hours: "int(1,168)"
  fit_mode: "list(smart|cover|contain)"
  display_model: "list(spectra_13_3_ee02|spectra_7_3_ee04)"
  orientation: "list(portrait|landscape)"
  smart_unused_percent: "int(0,40)"
  dither: bool
  dither_strength: "int(0,100)"
  night_start: "match(^([01]\\d|2[0-3]):[0-5]\\d$)"
  night_end: "match(^([01]\\d|2[0-3]):[0-5]\\d$)"

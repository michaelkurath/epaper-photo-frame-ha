        run: |
          printf '%s' "${ARCHIVE_B64}" | tr -d '[:space:]' | base64 --decode > /tmp/ee02-update.tar.gz
          echo "d1b9e5c7f536626fdf9aceee0e71a17a805e4553d8a42e72d7a3bcb7fd679f23  /tmp/ee02-update.tar.gz" | sha256sum -c -
          tar -xzf /tmp/ee02-update.tar.gz -C .
      - name: Run complete test suite
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          bash scripts/check.sh
      - name: Commit firmware
        run: |
          rm .github/workflows/import-ee02-firmware.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitignore README.md epaper_photo_frame/DOCS.md
          git add scripts/check.sh scripts/check-firmware.sh
          git add tests/test_firmware_source.py
          git add firmware/ee02_photo_frame firmware/tests/test_firmware_core.cpp
          git add -u .github/workflows/import-ee02-firmware.yml
          git diff --cached --check
          git commit -m "Add EE02 controller firmware 0.1.0"
          git push

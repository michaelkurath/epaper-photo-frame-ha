[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "epaper-photo-frame-ha"
version = "0.5.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi~=0.116.0",
  "Pillow~=11.3.0",
  "uvicorn~=0.35.0",
]

[tool.setuptools]
package-dir = {"" = "epaper_photo_frame/app"}

[tool.setuptools.packages.find]
where = ["epaper_photo_frame/app"]

[tool.setuptools.package-data]
frame_app = ["static/*.html"]
